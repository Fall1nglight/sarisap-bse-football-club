name: Sárisápi Bányász Sport Egyesület
shortName: Sárisápi BSE
founded: 1940
introduction: Helyi labdarúgó-közösség, ahol a felnőtt csapat, az utánpótlás és a szurkolók ugyanahhoz a történethez tartoznak.
history: A klub 1940. augusztus 20-án, Sárisápi Atlétikai Club néven és egy labdarúgó-szakosztállyal alakult meg. A második világháború után a Dorogi Szénbányák támogatásával vette fel a Sárisápi Bányász Sportegyesület nevet, amelyet a mai napig büszkén visel.
